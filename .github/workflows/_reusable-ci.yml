name: Reusable CI

# Callable building block: lint + test. Invoked by the PR gate and by both
# deploy workflows, so nothing ever deploys without these passing first.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --extra dev --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tme
          POSTGRES_PASSWORD: tme
          POSTGRES_DB: tme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tme -d tme"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Dummy app config so settings load; the DB/Redis URLs point at services.
      MAIN_BOT_TOKEN: "123456:CI-DUMMY-TOKEN"
      WEBHOOK_BASE_URL: "https://ci.example.com"
      WEBHOOK_SECRET: "ci-secret-0123456789"
      DATABASE_URL: "postgresql+asyncpg://tme:tme@localhost:5432/tme"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest
      - name: Validate migrations apply cleanly
        run: uv run alembic upgrade head
