# Local infra for TME development: Postgres + Redis.
# Usage:  docker compose up -d
# The app itself runs on the host via `uv run tme-api` (see README).

services:
  postgres:
    image: postgres:16-alpine
    container_name: tme-postgres
    environment:
      POSTGRES_USER: tme
      POSTGRES_PASSWORD: tme
      POSTGRES_DB: tme
    ports:
      - "5432:5432"
    volumes:
      - tme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tme -d tme"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tme-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tme_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tme_pgdata:
  tme_redisdata:
