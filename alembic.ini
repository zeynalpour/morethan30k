# Alembic configuration for TME.
# The database URL is injected at runtime from `tme.config.settings` in
# migrations/env.py, so the static `sqlalchemy.url` below is only a placeholder.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Overridden in env.py — do not rely on this value.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
